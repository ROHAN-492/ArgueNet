
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arguenet | Tactical Debate Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --midnight: #050012;
        --cyber-purple: #BF00FF;
        --cyber-blue: #00CCFF;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--midnight);
        color: #f5f5f5;
        min-height: 100vh;
        overflow-x: hidden;
        background-image: 
          radial-gradient(circle at 50% 0%, rgba(191, 0, 255, 0.05) 0%, transparent 50%),
          radial-gradient(circle at 100% 100%, rgba(0, 204, 255, 0.05) 0%, transparent 50%);
      }
      
      /* Tactical Background Data Stream */
      body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: -1;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
      }

      .cyber-heading {
        font-family: 'Orbitron', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
      }

      .neon-glow-purple {
        box-shadow: 0 0 20px rgba(191, 0, 255, 0.4);
      }
      
      .neon-glow-blue {
        box-shadow: 0 0 20px rgba(0, 204, 255, 0.3);
      }

      .ticker-container {
        width: 100%;
        overflow: hidden;
        white-space: nowrap;
        background: rgba(191, 0, 255, 0.05);
        border-bottom: 1px solid rgba(191, 0, 255, 0.1);
      }

      .ticker-content {
        display: inline-block;
        animation: ticker 30s linear infinite;
        padding-left: 100%;
      }

      @keyframes ticker {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-100%, 0, 0); }
      }

      .rank-gold { color: #FFD700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
      .rank-silver { color: #C0C0C0; text-shadow: 0 0 10px rgba(192, 192, 192, 0.5); }
      .rank-bronze { color: #CD7F32; text-shadow: 0 0 10px rgba(205, 127, 50, 0.5); }

      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: var(--midnight); }
      ::-webkit-scrollbar-thumb { background: var(--cyber-purple); }
    </style>
    <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "firebase/": "https://esm.sh/firebase@^12.9.0/"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
